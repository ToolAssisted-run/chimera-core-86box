name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# No machine ROM of 86Box's set is ours to put on a public runner. The gate
# builds a free PC instead - Sergey Kiselev's 8088 BIOS from source, for
# 86Box's Xi 8088 - and its own boot floppy, so every leg runs here: the
# builds, the package and Chimera's contract tests, the refusals, the native
# reference, input, sound, disks, virtual time, the sandbox against the
# native build, states, a project through chimera-run, and the project in
# Chimera's window. What does not run here: the FreeDOS leg (it needs
# FREEDOS_FLOPPY), and every machine other than the Xi 8088 (their ROMs are
# the user's); docs/PLAN.md says what ran where.
#
# NOT RUN YET: this file was written before the repository had a remote.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: gate (builds, package, Chimera contract, the free PC)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev nasm

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Fetch the XTIDE Universal BIOS the core carries
        # GPL-2.0-or-later, revision 638, from the project's Subversion
        # repository over HTTP, as waterbox/xtide-bios/xub.ref says; the
        # build checks the tree's hash and each image's SHA-1.
        run: |
          mkdir xub-src
          cd xub-src
          url='https://www.xtideuniversalbios.org/svn/xtideuniversalbios/!svn/bc/638/trunk'
          for d in XTIDE_Universal_BIOS Assembly_Library; do
            wget -q -r -np -nH --cut-dirs=5 -R 'index.html*' -e robots=off "$url/$d/"
          done

      - name: Fetch the source of the free BIOS the gate boots
        # Sergey Kiselev's 8088 BIOS (GPL-3.0), at the commit
        # tests/free-bios/8088_bios.ref names. For the tests only.
        run: |
          url="$(sed -n 's/^url //p' tests/free-bios/8088_bios.ref)"
          commit="$(sed -n 's/^commit //p' tests/free-bios/8088_bios.ref)"
          git init -q free-bios-src
          git -C free-bios-src remote add origin "$url"
          git -C free-bios-src fetch -q --depth 1 origin "$commit"
          git -C free-bios-src checkout -q FETCH_HEAD

      - name: Core gate (builds the package into build/Cores)
        env:
          CORE_VERSION: ${{ github.sha }}
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
          FREE_BIOS_SRC: ${{ github.workspace }}/free-bios-src
          XUB_SRC: ${{ github.workspace }}/xub-src
        run: |
          export LD_LIBRARY_PATH="$HOME/qt/6.12.0/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          sh waterbox/run-gate.sh

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: 86box-${{ github.sha }}
          path: build/Cores/86box.chimeraCore
          if-no-files-found: error

      - name: Upload the gate work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-work
          path: build/gate/

  publish:
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: 86box
      artifact: 86box-${{ github.sha }}
      package: 86box.chimeraCore
      kind: ${{ github.event.inputs.kind }}
